name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test when a test script is available
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test fixture pipeline
        run: |
          python -m pip install -e ./pipeline[dev]
          pytest pipeline/tests
          export TREE11_ROOT="$RUNNER_TEMP/tree11-fixture"
          python -m tree11_pipeline.cli build --fixture
          python -m tree11_pipeline.cli validate-history
          python -m tree11_pipeline.cli validate
